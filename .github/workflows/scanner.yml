# Salvar em: .github/workflows/scanner.yml
# Roda o scanner todo dia útil às 18:30 (Brasília), após o fechamento da B3,
# e avisa no Telegram. Também dá para disparar manualmente na aba Actions.
name: B3 Pivot Scanner

on:
  schedule:
    - cron: "30 21 * * 1-5"   # 21:30 UTC = 18:30 em Brasília
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15        # derruba sozinho se travar (o normal é 2 a 5 min)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python alert_job.py
        timeout-minutes: 10
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
