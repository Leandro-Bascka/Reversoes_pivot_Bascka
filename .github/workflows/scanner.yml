# Salvar em: .github/workflows/scanner.yml
# Roda o scanner todo dia útil às 18:30 (Brasília), após o fechamento da B3,
# e avisa no Telegram. Também pode ser disparado pelo botão do app ou manualmente na aba Actions.
# Grava os sinais novos em data/historico_sinais.csv (e os resultados dos antigos).
name: B3 Pivot Scanner

on:
  schedule:
    - cron: "30 21 * * 1-5"   # 21:30 UTC = 18:30 em Brasília
  workflow_dispatch:
    inputs:
      todos:
        description: "Enviar todos os sinais atuais (não só os novos)"
        type: boolean
        default: false

permissions:
  contents: write              # necessário para gravar o histórico no repositório

concurrency:
  group: scanner
  cancel-in-progress: false    # nunca dois runs ao mesmo tempo (evita conflito no histórico)

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25        # derruba sozinho se travar (com 100 ativos o normal é 3 a 8 min)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python alert_job.py
        timeout-minutes: 20
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ENVIAR_TODOS: ${{ inputs.todos && '1' || '0' }}
          # Opcional: crie "Variables" em Settings > Secrets and variables > Actions para mudar sem editar o arquivo
          PERFIL: ${{ vars.PERFIL || 'Equilibrado' }}          # Conservador | Equilibrado | Agressivo
          TIPO_SINAL: ${{ vars.TIPO_SINAL || 'dois' }}         # dois | antecipado | confirmado
          TOP_N: ${{ vars.TOP_N || '0' }}                      # 0 = todos os ativos da lista
      - name: Salvar histórico de sinais
        if: always()
        run: |
          if [ -f data/historico_sinais.csv ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/historico_sinais.csv
            if ! git diff --cached --quiet; then
              git commit -m "Atualiza histórico de sinais"
              git pull --rebase
              git push
            fi
          fi
